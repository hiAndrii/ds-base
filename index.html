<!doctype html>
<html lang="uk" data-theme="dark">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Design System Base</title>
    <style>
         :root {
            --bg: #FAFAFA;
            --fg: #18181B;
            --muted: #71717A;
        }
        
        [data-theme="dark"] {
            --bg: #09090B;
            --fg: #FAFAFA;
            --muted: #A1A1AA;
        }
        
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-content: center;
            gap: 8px;
            background: var(--bg);
            color: var(--fg);
            font: 16px/1.5 system-ui, sans-serif;
        }
        
        p {
            margin: 0;
            color: var(--muted);
        }
    </style>
</head>

<body>
    <h1>Design System Base</h1>
    <p>Token-driven. Five dials. Documentation coming.</p>
</body>

</html>
